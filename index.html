<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A free, interactive Python course for aspiring data analysts: notes, animated explainers, slides, mind maps, revision posters, a built-in Python runner, quizzes and flashcards.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Crect width=%2740%27 height=%2740%27 rx=%2710%27 fill=%27%232C68B0%27/%3E%3Ctext x=%2720%27 y=%2726%27 text-anchor=%27middle%27 font-family=%27monospace%27 font-size=%2715%27 font-weight=%27700%27 fill=%27white%27%3E%26gt;%26gt;%26gt;%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Python Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: notebook-style study hub. Sticky course-map sidebar on the left, one reading column on the right.
   Code appears as Jupyter-like cells (In [n] / Out). Highlighter yellow marks key terms. */
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --surface2:#EEF2F7; --ink:#162033; --muted:#58657A; --line:#D9E0EA;
  --accent:#2C68B0; --accent-ink:#FFFFFF; --accent-soft:#E2ECF8;
  --hl:#FFD43B; --hl-soft:#FFF3BF;
  --trap:#C03A26; --trap-soft:#FCE5E0; --tip:#1C7A50; --tip-soft:#DDF2E6; --key:#8A5A00; --key-soft:#FFF1CC;
  --code-bg:#F7F9FC; --out-bg:#FBFCFE;
  --sy-kw:#8B3DB8; --sy-str:#1D7A4E; --sy-num:#B4501A; --sy-com:#7A8698; --sy-fn:#2C68B0; --sy-bi:#9A5B05; --sy-dec:#C03A26;
  --c1:#2C68B0; --c1s:#E2ECF8; --c2:#1C7A50; --c2s:#DDF2E6; --c3:#B4501A; --c3s:#FBE6D8; --c4:#8B3DB8; --c4s:#F1E4F8;
  --c5:#A07800; --c5s:#FFF1CC; --c6:#C03A26; --c6s:#FCE5E0; --c7:#0E7C86; --c7s:#D9F1F2; --c8:#5B5FC7; --c8s:#E6E7FA;
  --shadow:0 1px 2px rgba(22,32,51,.06),0 8px 24px -14px rgba(22,32,51,.25);
  --pst-a:#E3EEFA; --pst-b:#E2F4F0; --pst-card:#E8F4F2;
  --display:"Lexend","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131B; --surface:#151C27; --surface2:#1B2431; --ink:#E6ECF4; --muted:#9BA8BB; --line:#283345;
    --accent:#72A9EE; --accent-ink:#071A30; --accent-soft:#18304D;
    --hl:#F2CC3D; --hl-soft:#3B3313;
    --trap:#F2876F; --trap-soft:#3A1E18; --tip:#5ECB95; --tip-soft:#12301F; --key:#F2CC3D; --key-soft:#352D10;
    --code-bg:#111823; --out-bg:#121A25;
    --sy-kw:#C99BF0; --sy-str:#8FD3A8; --sy-num:#F5A66E; --sy-com:#76839A; --sy-fn:#8CB8F5; --sy-bi:#E8C27A; --sy-dec:#F2876F;
    --c1:#72A9EE; --c1s:#18304D; --c2:#5ECB95; --c2s:#12301F; --c3:#F5A66E; --c3s:#3A2416; --c4:#C99BF0; --c4s:#2E1E3D;
    --c5:#F2CC3D; --c5s:#352D10; --c6:#F2876F; --c6s:#3A1E18; --c7:#5BD0D8; --c7s:#0F3134; --c8:#A3A6F5; --c8s:#22244A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.7);
    --pst-a:#152338; --pst-b:#122C2A; --pst-card:#16302D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#151C27; --surface2:#1B2431; --ink:#E6ECF4; --muted:#9BA8BB; --line:#283345;
  --accent:#72A9EE; --accent-ink:#071A30; --accent-soft:#18304D;
  --hl:#F2CC3D; --hl-soft:#3B3313;
  --trap:#F2876F; --trap-soft:#3A1E18; --tip:#5ECB95; --tip-soft:#12301F; --key:#F2CC3D; --key-soft:#352D10;
  --code-bg:#111823; --out-bg:#121A25;
  --sy-kw:#C99BF0; --sy-str:#8FD3A8; --sy-num:#F5A66E; --sy-com:#76839A; --sy-fn:#8CB8F5; --sy-bi:#E8C27A; --sy-dec:#F2876F;
  --c1:#72A9EE; --c1s:#18304D; --c2:#5ECB95; --c2s:#12301F; --c3:#F5A66E; --c3s:#3A2416; --c4:#C99BF0; --c4s:#2E1E3D;
  --c5:#F2CC3D; --c5s:#352D10; --c6:#F2876F; --c6s:#3A1E18; --c7:#5BD0D8; --c7s:#0F3134; --c8:#A3A6F5; --c8s:#22244A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.7);
  --pst-a:#152338; --pst-b:#122C2A; --pst-card:#16302D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 2px;border-radius:2px}
code{font-family:var(--mono);font-size:.86em;background:var(--surface2);border:1px solid var(--line);padding:1px 5px;border-radius:5px;white-space:pre-wrap;overflow-wrap:anywhere}
kbd{font-family:var(--mono);font-size:.8em;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);
  padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;flex:none}
.brand b{font-family:var(--display);font-size:18px;font-weight:700;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:13px}
.search{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:15px}
.navtools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.navtools button{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:700;text-align:left;display:flex;align-items:center;gap:8px;background:var(--bg)}
.navtools button svg{width:16px;height:16px;flex:none;stroke:var(--accent)}
.navtools button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.navtools button.on svg{stroke:var(--accent-ink)}
.prog{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;width:0;transition:width .4s}
.parts{display:flex;flex-direction:column;gap:12px}
.part-h{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.chlink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 8px;border-radius:8px;font-size:15px;line-height:1.3}
.chlink:hover{background:var(--surface2)}
.chlink.on{background:var(--accent-soft);color:var(--ink);font-weight:700}
.chlink .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--muted)}
.chlink.done .dot{background:var(--tip);border-color:var(--tip);color:var(--surface)}
.chlink .tk{margin-left:auto;font-size:10px;font-family:var(--mono);color:var(--trap);border:1px solid var(--trap);border-radius:99px;padding:0 5px;flex:none}
.chlink[hidden]{display:none}
.topbar{display:none}
.scrim{display:none}

.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 80px}
.col{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.col.wide{max-width:1120px}

@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line);
    align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .menu{border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center}
  .topbar .tt{font-family:var(--display);font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side{position:fixed;z-index:70;top:0;left:0;bottom:0;height:100%;width:min(320px,88vw);transform:translateX(-102%);transition:transform .25s;
    padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .scrim.open{display:block;position:fixed;inset:0;z-index:65;background:rgba(10,15,25,.45)}
  .main{padding-block:18px 64px}
}

/* ---------- Generic pieces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 15px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--tip-soft);border-color:var(--tip);color:var(--tip)}
.btn svg{width:16px;height:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--surface2);color:var(--muted)}
.pill.trap{background:var(--trap-soft);color:var(--trap)}
.pill.lvl{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}
.h2{font-size:24px}
.sec{display:flex;flex-direction:column;gap:14px}
.sec>h2{font-size:24px;padding-top:10px;scroll-margin-top:80px}
.sec>h3{font-size:19px;padding-top:4px}
.prose{max-width:68ch}
.prose b{font-weight:700}
ul.list{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;max-width:68ch}
ol.list{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;max-width:68ch}

/* ---------- Chapter header ---------- */
.chead{display:flex;flex-direction:column;gap:12px;padding-bottom:6px}
.chead .num{font-family:var(--display);font-weight:700;font-size:15px;color:var(--accent)}
.chead h1{font-size:clamp(30px,5vw,44px);font-weight:700;letter-spacing:-.01em}
.chead .lead{font-size:19px;color:var(--muted);max-width:60ch}
.goals{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.goals h3{font-size:16px;margin-bottom:8px}
.goals ul{margin:0;padding-left:20px;display:grid;gap:4px}
.toc{display:flex;gap:6px;flex-wrap:wrap}
.toc button{font-size:13px;border:1px solid var(--line);border-radius:99px;padding:4px 11px;background:var(--surface);color:var(--muted)}
.toc button:hover{color:var(--ink);border-color:var(--accent)}
.srcs{font-size:13px;color:var(--muted)}

/* ---------- Notebook code cells ---------- */
.cell{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code-bg)}
.cell-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px 6px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.cell-top .lbl{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600}
.cell-top .ttl{font-size:13px;color:var(--muted);flex:1;min-width:0}
.copy{font-size:12px;font-family:var(--mono);border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
.copy:hover{color:var(--ink)}
pre{margin:0;font-family:var(--mono);font-size:14px;line-height:1.6;overflow-x:auto;padding:12px 14px;tab-size:4}
.out{border-top:1px dashed var(--line);background:var(--out-bg)}
.out .lbl2{font-family:var(--mono);font-size:12px;color:var(--tip);padding:6px 14px 0;font-weight:600}
.out pre{padding-top:4px;color:var(--ink)}
.out.err .lbl2{color:var(--trap)}
.out.err pre{color:var(--trap)}
.k{color:var(--sy-kw);font-weight:600}.s{color:var(--sy-str)}.n{color:var(--sy-num)}.c{color:var(--sy-com);font-style:italic}.f{color:var(--sy-fn)}.b{color:var(--sy-bi)}.d{color:var(--sy-dec)}

/* ---------- Callouts ---------- */
.call{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border:1px solid transparent}
.call .tag{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;gap:7px}
.call .tag svg{width:17px;height:17px}
.call.trap{background:var(--trap-soft);border-color:color-mix(in srgb,var(--trap) 35%,transparent)}
.call.trap .tag{color:var(--trap)}
.call.tip{background:var(--tip-soft);border-color:color-mix(in srgb,var(--tip) 30%,transparent)}
.call.tip .tag{color:var(--tip)}
.call.key{background:var(--key-soft);border-color:color-mix(in srgb,var(--key) 30%,transparent)}
.call.key .tag{color:var(--key)}
.call.like{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.call.like .tag{color:var(--accent)}
.call.why{background:var(--surface);border-color:var(--line)}
.call.why .tag{color:var(--muted)}
.call code{background:var(--surface)}

/* ---------- Figures / tables / compare ---------- */
figure{margin:0;display:flex;flex-direction:column;gap:8px}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;overflow-x:auto}
.fig svg{display:block;max-width:100%;height:auto;margin:0 auto}
figcaption{font-size:14px;color:var(--muted);text-align:center}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-weight:600;font-size:14px;background:var(--surface2)}
tr:last-child td{border-bottom:0}
td code{white-space:pre}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cmp>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cmp h4{font-size:16px}
@media (max-width:640px){.cmp{grid-template-columns:minmax(0,1fr)}}

/* SVG diagram classes */
.sv-t{fill:var(--ink);font-family:var(--body);font-size:15px}
.sv-tm{fill:var(--ink);font-family:var(--mono);font-size:15px}
.sv-m{fill:var(--muted);font-family:var(--mono);font-size:12px}
.sv-mb{fill:var(--muted);font-family:var(--body);font-size:13px}
.sv-h{fill:var(--ink);font-family:var(--display);font-size:15px;font-weight:600}
.sv-box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.sv-soft{fill:var(--surface2);stroke:var(--line);stroke-width:1.5}
.sv-acc{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.sv-hl{fill:var(--hl-soft);stroke:var(--hl);stroke-width:2}
.sv-trap{fill:var(--trap-soft);stroke:var(--trap);stroke-width:1.5}
.sv-tip{fill:var(--tip-soft);stroke:var(--tip);stroke-width:1.5}
.sv-ln{stroke:var(--muted);stroke-width:1.6;fill:none}
.sv-lna{stroke:var(--accent);stroke-width:2;fill:none}
.sv-lnt{stroke:var(--trap);stroke-width:2;fill:none}
.sv-lng{stroke:var(--tip);stroke-width:2;fill:none}
.sv-ta{fill:var(--accent)}.sv-tt{fill:var(--trap)}.sv-tg{fill:var(--tip)}
.mk{fill:var(--muted)}.mka{fill:var(--accent)}.mkt{fill:var(--trap)}.mkg{fill:var(--tip)}

/* ---------- Animated explainer player ---------- */
.player{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.ph{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ph .badge{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--trap);color:var(--surface);border-radius:5px;padding:2px 7px;flex:none}
.ph b{font-family:var(--display);font-weight:600;font-size:16px;min-width:0}
.stage{position:relative;min-height:240px;background:var(--bg)}
.stage-in{padding:16px}
.cover{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(2px)}
.cover[hidden]{display:none}
.bigplay{display:flex;flex-direction:column;align-items:center;gap:10px;font-family:var(--display);font-weight:600}
.bigplay span.circ{width:72px;height:72px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:var(--shadow)}
.bigplay svg{width:30px;height:30px;fill:var(--accent-ink);margin-left:5px}
.capt{padding:12px 16px;border-top:1px solid var(--line);font-size:17px;min-height:64px;background:var(--surface);display:flex;gap:10px;align-items:flex-start}
.capt .sn{font-family:var(--mono);font-size:12px;color:var(--accent);padding-top:4px;flex:none}
.ctrl{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.ctrl button.ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line)}
.ctrl button.ic:hover{border-color:var(--accent)}
.ctrl button.ic svg{width:16px;height:16px;fill:var(--ink)}
.ctrl button.ic.play{background:var(--accent);border-color:var(--accent)}
.ctrl button.ic.play svg{fill:var(--accent-ink)}
.ticks{display:flex;gap:4px;flex:1 1 140px;min-width:120px}
.ticks button{flex:1;height:8px;border-radius:99px;background:var(--surface2);border:0}
.ticks button.past{background:color-mix(in srgb,var(--accent) 45%,var(--surface2))}
.ticks button.cur{background:var(--accent)}
.spd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
/* tracer */
.tr{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px}
@media (max-width:700px){.tr{grid-template-columns:minmax(0,1fr)}}
.tr-code{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:8px 0;overflow-x:auto}
.tr-line{display:flex;font-family:var(--mono);font-size:14px;line-height:1.75;white-space:pre;padding-right:12px}
.tr-line .ln{width:34px;flex:none;text-align:right;padding-right:10px;color:var(--muted);user-select:none}
.tr-line .ar{width:16px;flex:none;color:var(--accent);font-weight:700}
.tr-line.cur{background:var(--hl-soft)}
.tr-line.cur .ln{color:var(--ink);font-weight:600}
.tr-line.done{opacity:.95}
.tr-right{display:flex;flex-direction:column;gap:10px;min-width:0}
.pane{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.pane h5{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);font-weight:600}
.vars{display:flex;flex-direction:column;gap:0}
.var{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:14px;flex-wrap:wrap}
.var:last-child{border-bottom:0}
.var .nm{color:var(--sy-fn);font-weight:600;min-width:40px}
.var .vl{background:var(--surface2);border-radius:6px;padding:1px 7px;min-width:0;overflow-wrap:anywhere}
.var .vl.ref{background:var(--accent-soft);color:var(--accent);font-weight:600}
.var.chg .vl{background:var(--hl);color:#1a1400;animation:pop .5s}
.var .ty{font-size:11px;color:var(--muted)}
.scope{font-family:var(--mono);font-size:11px;color:var(--muted);padding:4px 10px;background:var(--surface2);border-bottom:1px solid var(--line)}
.heap .var .nm{color:var(--accent)}
.console pre{font-size:13.5px;padding:8px 10px;min-height:36px;max-height:170px;overflow:auto;background:var(--code-bg)}
.empty{color:var(--muted);font-family:var(--body);font-size:13px;padding:8px 10px}
@keyframes pop{0%{transform:scale(1.15)}100%{transform:scale(1)}}
/* frames */
.fr{display:flex;flex-direction:column;align-items:safe center;justify-content:center;gap:12px;min-height:230px;text-align:center;overflow-x:auto;max-width:100%}
.fr>svg{flex:none}
.fr svg{max-width:100%;height:auto}
.fr .bigcode{font-family:var(--mono);font-size:clamp(17px,3.6vw,24px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 18px;max-width:100%;overflow-x:auto;white-space:pre}
.fr .bigcode u{text-decoration:none;background:var(--hl);color:#1a1400;border-radius:4px;padding:0 3px}
.fr .res{font-family:var(--mono);font-size:18px;color:var(--tip);font-weight:600}

/* ---------- Slides ---------- */
.deck{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.deck .ph .badge{background:var(--accent);color:var(--accent-ink)}
.slide{min-height:330px;padding:28px clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:14px;justify-content:center;
  background-image:radial-gradient(circle at 100% 0,var(--accent-soft),transparent 45%)}
.slide .sk{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.slide h3{font-size:clamp(22px,4vw,30px);font-weight:700}
.slide .sb{font-size:18px;display:flex;flex-direction:column;gap:10px;max-width:62ch}
.slide .sb ul{margin:0;padding-left:22px;display:grid;gap:6px}
.slide .cell{max-width:100%}
.slide .big{font-family:var(--display);font-size:clamp(26px,5vw,40px);font-weight:700;line-height:1.15}
.deck .ctrl{justify-content:space-between}
.sdots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1}
.sdots button{width:10px;height:10px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.sdots button.cur{background:var(--accent);border-color:var(--accent)}

/* ---------- Mind map ---------- */
.mm{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;overflow-x:auto}
.mm svg{display:block;margin:0 auto;height:auto}
.mm .mmh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 8px 4px;flex-wrap:wrap}
.mm .mmh b{font-family:var(--display);font-weight:600}
.mm .lf{fill:var(--ink);font-family:var(--body);font-size:13.5px}
.mm .bt{font-family:var(--display);font-weight:600;font-size:14px}
.mm .rt{font-family:var(--display);font-weight:700;font-size:17px;fill:var(--accent-ink)}
.mm .br{cursor:default}
.mm .br.go{cursor:pointer}
.mm .br.go:hover rect{stroke-width:3}
.mm .br.go:focus-visible rect{stroke-width:4}

/* ---------- Predict / practice ---------- */
.pred{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px}
.pred .ph2{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600}
.pred .ph2 .q{width:28px;height:28px;border-radius:8px;background:var(--hl);color:#1a1400;display:grid;place-items:center;font-weight:700}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:flex-start;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{font-family:var(--mono);color:var(--muted);flex:none}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt .t code{white-space:pre-wrap}
.opt.right{background:var(--tip-soft);border-color:var(--tip)}
.opt.wrong{background:var(--trap-soft);border-color:var(--trap)}
.opt:disabled{cursor:default}
.expl{border-radius:10px;padding:10px 12px;background:var(--surface2);font-size:16px}
.expl b{display:block}
.prac{display:flex;flex-direction:column;gap:10px}
.task{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.task .tq{display:flex;gap:10px}
.task .tq .tn{font-family:var(--mono);font-size:13px;color:var(--surface);background:var(--ink);border-radius:6px;padding:1px 7px;height:fit-content;flex:none;margin-top:2px}
details.reveal{border-top:1px dashed var(--line);padding-top:6px}
details.reveal summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:15px;padding:4px 0}
details.reveal[open] summary{margin-bottom:6px}

/* ---------- Quiz ---------- */
.quiz{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:12px}
.qmeta{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.qtext{font-family:var(--display);font-size:clamp(18px,3vw,21px);font-weight:600;line-height:1.35}
.qbar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.score{font-family:var(--display);font-size:48px;font-weight:700;line-height:1}
.review{display:flex;flex-direction:column;gap:8px}
.review div{display:flex;gap:10px;font-size:15px;align-items:flex-start}
.review .ok{color:var(--tip);font-weight:700;flex:none;width:64px}
.review .no{color:var(--trap);font-weight:700;flex:none;width:64px}

/* ---------- Flashcards ---------- */
.fc{display:flex;flex-direction:column;gap:12px}
.fcbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.flip{width:100%;min-height:250px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:26px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:10px;box-shadow:var(--shadow);
  background-image:repeating-linear-gradient(transparent 0 31px,color-mix(in srgb,var(--accent) 9%,transparent) 31px 32px)}
.flip.back{background-color:var(--accent-soft)}
.flip .fside{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.flip .fq{font-family:var(--display);font-size:clamp(21px,4vw,27px);font-weight:600;line-height:1.25}
.flip .fa{font-size:18px;line-height:1.55}
.flip .fa pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;margin-top:6px;font-size:14px}
.flip .hint{font-size:13px;color:var(--muted)}
.flip .from{font-size:12px;color:var(--muted)}

/* ---------- Home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,36px);
  background-image:linear-gradient(var(--surface2) 1px,transparent 1px),linear-gradient(90deg,var(--surface2) 1px,transparent 1px);background-size:26px 26px}
.hero h1{font-size:clamp(32px,5.5vw,52px);font-weight:700;letter-spacing:-.015em}
.hero p{font-size:18px;color:var(--muted);max-width:52ch;margin-top:12px}
.hero .row{margin-top:18px}
.hero-term{background:var(--code-bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.hero-term .tb{display:flex;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.hero-term .tb i{width:10px;height:10px;border-radius:50%;background:var(--line)}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{font-family:var(--display);font-size:28px;display:block;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pcard h3{font-size:18px}
.pcard .pn{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pcard ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.pcard li button{width:100%;text-align:left;padding:5px 6px;border-radius:7px;font-size:15px;display:flex;gap:8px;align-items:center}
.pcard li button:hover{background:var(--surface2)}
.pcard li .st{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none}
.pcard li .st.d{background:var(--tip);border-color:var(--tip)}
.tools3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.tools3{grid-template-columns:minmax(0,1fr)}}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px}
.tool:hover{border-color:var(--accent)}
.tool b{font-family:var(--display);font-size:18px;font-weight:600}
.tool span{color:var(--muted);font-size:15px}
.how{counter-reset:h;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:15px}
.how div b{display:block;font-family:var(--display);font-weight:600;margin-bottom:4px}

/* ---------- Chapter end ---------- */
.endnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.endnav .btn{max-width:100%}
.donebox{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.take{background:var(--hl-soft);border-radius:14px;padding:16px 20px}
.take h3{font-size:18px;margin-bottom:8px}
.take ul{margin:0;padding-left:20px;display:grid;gap:5px}
.cheat{display:flex;flex-direction:column;gap:14px}
.cheat h3{font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:90;font-size:15px}
.toast[hidden]{display:none}

/* ---------- Code runner ---------- */
.runner{border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:12px;overflow:hidden;background:var(--code-bg)}
.rbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;background:var(--accent-soft);flex-wrap:wrap}
.rlbl{font-family:var(--display);font-weight:600;font-size:14px;color:var(--accent)}
.rstat{font-size:12px;color:var(--muted);font-family:var(--mono)}
.rstat.ok{color:var(--tip)} .rstat.bad{color:var(--trap)}
.ed{position:relative}
.edhl,.edta{margin:0;padding:12px 14px;font-family:var(--mono);font-size:14px;line-height:1.6;tab-size:4;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;border:0;min-height:120px;width:100%;letter-spacing:0}
.edhl{pointer-events:none;color:var(--ink);background:transparent;overflow:hidden}
.edta{position:absolute;inset:0;height:100%;resize:none;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--ink);outline:none;overflow:hidden}
.edta::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.edta:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ract{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line);background:var(--surface)}
.rhint{font-size:12px}
.rout{border-top:1px dashed var(--line);background:var(--out-bg)}
.rout .lbl2{font-family:var(--mono);font-size:12px;color:var(--tip);padding:6px 14px 0;font-weight:600}
.rtext{padding-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.rtext.dim{color:var(--muted)}
.rerr{color:var(--trap);padding-top:0;white-space:pre-wrap;overflow-wrap:anywhere}
.inrow{display:flex;gap:8px;padding:0 14px 12px}
.inbox{flex:1;min-width:0;border:1px solid var(--accent);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:14px;background:var(--surface)}
.btn:disabled{opacity:.6;cursor:progress}

/* ---------- Revision posters ---------- */
.poster{container-type:inline-size;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--pst-a),var(--bg) 220px)}
.phd{padding:18px 20px 16px;text-align:center;background:linear-gradient(90deg,var(--pst-a),var(--pst-b));border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;align-items:center}
.phd .pnum{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.phd h3{font-size:clamp(20px,3.4vw,30px);font-weight:700;letter-spacing:-.01em}
.phd p{color:var(--muted);font-size:15px;max-width:70ch}
.pmods{display:grid;grid-template-columns:minmax(0,1fr)}
.pmod{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pmod+.pmod{border-top:1px dashed var(--line)}
@container (min-width:980px){.pmods{grid-template-columns:repeat(2,minmax(0,1fr))}.pmod+.pmod{border-top:0;border-left:1px dashed var(--line)}}
.pmh{text-align:center;display:flex;flex-direction:column;gap:2px}
.pmh span{font-family:var(--display);font-weight:700;color:var(--accent);font-size:14px}
.pmh h4{font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.pmh p{color:var(--muted);font-size:14px}
.pgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@container (max-width:600px){.pgrid2{grid-template-columns:minmax(0,1fr)}}
.pcd{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.pcd.span{grid-column:1/-1}
.pcd h4{font-family:var(--display);font-size:15px;font-weight:600;padding:8px 12px;background:var(--pst-card);text-align:center}
.pcd[data-k="trap"] h4{background:var(--trap-soft);color:var(--trap)}
.pcd[data-k="tip"] h4{background:var(--tip-soft);color:var(--tip)}
.pcd[data-k="key"] h4{background:var(--key-soft);color:var(--key)}
.pcb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;line-height:1.45;flex:1}
.psub{color:var(--muted);text-align:center;font-size:13.5px}
.psvg svg{width:100%;height:auto;display:block;min-width:0!important;margin:0 auto}
.pcode,.pout{font-size:13px;padding:8px 10px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.pcode{background:var(--code-bg);border:1px solid var(--line)}
.pout{background:var(--out-bg);border:1px dashed var(--line);color:var(--tip);margin-top:-4px}
.pverd{font-weight:700;text-align:center;font-family:var(--display)}
.pverd.ok{color:var(--tip)} .pverd.no{color:var(--trap)} .pverd.warn{color:var(--key)}
.pul{margin:0;padding-left:18px;display:grid;gap:4px}
.prules{display:grid;gap:6px}
.prule{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:4px 10px;align-items:baseline;padding:6px 9px;border-radius:9px;background:var(--surface2)}
.prule b{font-family:var(--mono);font-size:13px;font-weight:600}
.prule[data-k="trap"]{background:var(--trap-soft)} .prule[data-k="trap"] b{color:var(--trap)}
.prule[data-k="tip"]{background:var(--tip-soft)} .prule[data-k="tip"] b{color:var(--tip)}
.prule[data-k="key"]{background:var(--key-soft)} .prule[data-k="key"] b{color:var(--key)}
.prule[data-k="acc"]{background:var(--accent-soft)} .prule[data-k="acc"] b{color:var(--accent)}
.pfoot{font-size:13px;color:var(--muted);text-align:center}
.ptbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ptbl table{font-size:14px}
.ptbl thead th{background:var(--accent);color:var(--accent-ink);text-align:center;font-size:14px}
.ptbl thead th[data-k="trap"]{background:var(--trap-soft);color:var(--trap)}
.ptbl thead th[data-k="tip"]{background:var(--tip-soft);color:var(--tip)}
.ptbl thead th[data-k="key"]{background:var(--key-soft);color:var(--key)}
.ptbl thead th[data-k="acc"]{background:var(--accent-soft);color:var(--accent)}
.ptbl tbody th{background:var(--pst-card);font-family:var(--display);font-weight:600;font-size:14px;white-space:nowrap}
.ptbl td{text-align:center}
.t-ok{color:var(--tip);font-weight:700} .t-no{color:var(--trap);font-weight:700} .t-warn{color:var(--key);font-weight:700} .t-acc{color:var(--accent);font-weight:700}
.navtools button:first-child{grid-column:span 2}
select.search{appearance:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- Diagram helpers (return SVG strings) ---------- */

(function(){

/* helper: build frames that highlight a slice step by step */
function sliceFrames(text, start, stop, step, label, stopLabel){
  var chars = text.split(''), picked = [], frames = [];
  frames.push({ html: V.strip(chars, { neg: true, rowLabels: true, w: 40 }) + '<div class="bigcode">' + V.esc(label) + '</div>', c: 'Here is the string with its index numbers. Positive numbers count from the left starting at 0. Negative numbers count from the right starting at -1.' });
  var idxs = [];
  var n = chars.length;
  var s = start, e = stop;
  if (step > 0) { for (var i = s; i < e && i < n; i += step) idxs.push(i); }
  else { for (var j = s; j > e && j >= 0; j += step) idxs.push(j); }
  idxs.forEach(function(ix, k){
    picked.push(chars[ix]);
    frames.push({ html: V.strip(chars, { neg: true, rowLabels: true, w: 40, hl: [ix], hl2: idxs.slice(0, k) }) + '<div class="bigcode">' + V.esc(label) + '</div><div class="res">so far: "' + V.esc(picked.join('')) + '"</div>', c: 'Take index ' + ix + ' (' + JSON.stringify(chars[ix]) + ').' + (k === 0 ? ' This is the start position.' : ' Then jump ' + Math.abs(step) + ' step' + (Math.abs(step) > 1 ? 's' : '') + (step < 0 ? ' to the left.' : '.')) });
  });
  frames.push({ html: V.strip(chars, { neg: true, rowLabels: true, w: 40, hl2: idxs }) + '<div class="bigcode">' + V.esc(label) + '</div><div class="res">result: "' + V.esc(picked.join('')) + '"</div>', c: 'We stop before index ' + (stopLabel != null ? stopLabel : stop) + ', because the stop position is never included. The result is "' + picked.join('') + '".' });
  return frames;
}

import pickle

def load_db(path="cinema.pkl"):
    try:
        with open(path, "rb") as f:
            return pickle.load(f)
    except FileNotFoundError:
        return {
            "Ramayan": {"price": 1000, "seats": 20},
            "Drishyam": {"price": 500, "seats": 40},
            "Hanuman Ansh": {"price": 700, "seats": 10},
            "Udta Teer": {"price": 400, "seats": 50},
        }

def save_db(db, path="cinema.pkl"):
    with open(path, "wb") as f:
        pickle.dump(db, f)

def show_movies(db):
    for name, d in db.items():
        print(f"{name:<14} Rs {d['price']:>5}  {d['seats']:>3} seats left")

def book(db, movie, n):
    if movie not in db:
        return "Movie not found"
    if n <= 0 or n > db[movie]["seats"]:
        return "Insufficient seats or invalid number of seats"
    db[movie]["seats"] -= n
    bill = db[movie]["price"] * n
    return f"{n} seats booked for {movie}. Bill: Rs {bill}"

def cancel(db, movie, n):
    if movie not in db:
        return "Movie not found"
    refund = db[movie]["price"] * n * 0.5
    db[movie]["seats"] += n
    return f"{n} seats cancelled. Refund (50%): Rs {refund}"

class InventoryManagementSystem:
    def __init__(self):
        self.inventory = {}        # dict: item_id -> details
        self.categories = set()    # set: unique categories
        self.transactions = []     # list: history
        self.next_id = 1

    def add_item(self, name, category, price, quantity):
        item_id = f"ITEM{self.next_id:04d}"          # string ID
        self.next_id += 1
        self.categories.add(category)
        self.inventory[item_id] = {
            "properties": (name, category, price),     # tuple: fixed facts
            "quantity": quantity,
        }
        self.transactions.append(("ADD", item_id, quantity))
        return item_id

    def update_quantity(self, item_id, change):
        if item_id not in self.inventory:
            return False
        self.inventory[item_id]["quantity"] += change
        kind = "RESTOCK" if change > 0 else "SALE"
        self.transactions.append((kind, item_id, abs(change)))
        return True

    def search_by_name(self, part):
        part = part.lower()
        return [item["properties"][0] for item in self.inventory.values()
                if part in item["properties"][0].lower()]

    def low_stock(self, threshold=5):
        result = []
        for item in self.inventory.values():
            if item["quantity"] <= threshold:
                result.append(item["properties"][0])
        return result                                  # after the loop!

    def report(self):
        total_value = sum(item["properties"][2] * item["quantity"]
                          for item in self.inventory.values())
        by_category = {}
        for item in self.inventory.values():
            cat = item["properties"][1]
            by_category[cat] = by_category.get(cat, 0) + item["quantity"]
        lines = [f"Total unique items: {len(self.inventory)}",
                 f"Total inventory value: {total_value:,.2f}",
                 "Category breakdown:"]
        for cat, count in sorted(by_category.items(), key=lambda x: x[1], reverse=True):
            lines.append(f"- {cat}: {count} units")
        return "\n".join(lines)

import pickle

library = {"Python Basics": 3, "SQL Guide": 1, "Data Viz": 2}
borrowed = {}                                   # member -> list of titles

def borrow(member, title):
    if library.get(title, 0) == 0:
        return f"Sorry, '{title}' is not available"
    library[title] -= 1
    borrowed.setdefault(member, []).append(title)

  var sum = function(arr){ return arr.reduce(function(a, k){ return a + blockH(k); }, 0); };

  var W = two ? twoW : oneW;

      var leaves = k.k || [];

        s += '<circle cx="' + (lx - d * 4) + '" cy="' + ly + '" r="3" fill="' + col + '"/>';
        var go = typeof l === 'object' && l.go;
        var txt = '<text x="' + (lx + d * 4) + '" y="' + (ly + 4.5) + '" text-anchor="' + (d > 0 ? 'start' : 'end') + '" class="lf"' + (go ? ' style="text-decoration:underline;text-decoration-color:var(--line)"' : '') + '>' + esc(leafText(l)) + '</text>';
        s += go ? '<g class="br go" role="link" tabindex="0" data-go="' + esc(l.go) + '" aria-label="Open ' + esc(leafText(l)) + '">' + txt + '</g>' : txt;
      });

      y += bh;
    });
  }
  sideDraw(right, 1); sideDraw(left, -1);
  s += '<rect x="' + (rootX - rootW / 2) + '" y="' + (rootY - rootH / 2) + '" width="' + rootW + '" height="' + rootH + '" rx="14" fill="var(--accent)"/>' +
    '<text x="' + rootX + '" y="' + (rootY + 6) + '" text-anchor="middle" class="rt">' + esc(mm.root) + '</text>';
  var wAttr = W <= cw ? 'width="' + W + '" style="max-width:100%"' : 'width="' + W + '"';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" ' + wAttr + ' role="img" aria-label="Mind map: ' + esc(mm.root) + '">' + s + '</svg>';
}

function Quiz(el, qs, key, opts){

/* ---------- Python runner (Pyodide in a worker) ---------- */
var PY_INDEX = /[?&]localpy\b/.test(location.search) ? 'pyodide_local/' : 'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/';
var PY = { worker: null, state: 'idle', boot: null, cb: {}, seq: 0, listeners: [] };
function pySetState(s, msg){ PY.state = s; PY.msg = msg || ''; PY.listeners.forEach(function(f){ f(s, PY.msg); }); }
function pyBoot(){
  if (PY.boot) return PY.boot;
  pySetState('loading', 'Starting Python... (first time takes 5 to 15 seconds)');
  PY.boot = new Promise(function(resolve, reject){
    try { PY.worker = new Worker('py-worker.js'); } catch (e) { pySetState('fail', 'Could not start Python in this browser.'); reject(e); return; }
    PY.worker.onmessage = function(ev){
      var m = ev.data;
      if (m.type === 'ready') { pySetState('ready', 'Python ' + m.version + ' ready'); resolve(); }
      else if (m.type === 'fatal') { pySetState('fail', 'Python could not load. Check your internet connection and refresh.'); PY.boot = null; reject(new Error(m.error)); }
      else if (m.type === 'status') { var c = PY.cb[m.id]; if (c && c.status) c.status(m.text); }
      else if (m.type === 'done') { var d = PY.cb[m.id]; delete PY.cb[m.id]; if (d) d.done(m); }
    };
    PY.worker.onerror = function(){ pySetState('fail', 'Python could not load. Check your internet connection and refresh.'); PY.boot = null; reject(new Error('worker error')); };
    PY.worker.postMessage({ type: 'init', indexURL: PY_INDEX });
  });
  return PY.boot;
}
function pyRun(code, inputs, onStatus){
  return pyBoot().then(function(){
    return new Promise(function(resolve){
      var id = ++PY.seq;
      PY.cb[id] = { done: resolve, status: onStatus };
      PY.worker.postMessage({ type: 'run', id: id, code: code, inputs: inputs });
    });
  });
}
function pyStop(){
  if (PY.worker) PY.worker.terminate();
  Object.keys(PY.cb).forEach(function(k){ PY.cb[k].done({ status: 'stopped', out: '', err: '' }); });
  PY.cb = {}; PY.worker = null; PY.boot = null;
  pySetState('idle', 'Stopped. Python restarts on your next Run.');
}

/* Code box with highlighting overlay */
function CodeBox(el, b){
  var key = 'code:' + b.key;
  var starter = b.starter || '# Write your code here, then press Run (or Ctrl + Enter)\n';
  var saved = store.get(key, null);
  el.innerHTML = '<div class="runner"><div class="rbar"><span class="rlbl">Try it yourself</span><span class="rstat" aria-live="polite"></span></div>' +
    '<div class="ed"><pre class="edhl" aria-hidden="true"></pre><textarea class="edta" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Python code editor"></textarea></div>' +
    '<div class="ract"><button class="btn pri rrun" type="button"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2l10 6-10 6z"/></svg>Run</button>' +
    '<button class="btn rstop" type="button" hidden>Stop</button><button class="btn rreset" type="button">Reset</button><span class="muted rhint">Ctrl + Enter runs your code</span></div>' +
    '<div class="rout" hidden><div class="lbl2">Output</div><pre class="rtext"></pre><pre class="rerr" hidden></pre>' +
    '<form class="inrow" hidden><input class="inbox" type="text" autocomplete="off" aria-label="Your answer for input()"><button class="btn pri" type="submit">Enter</button></form></div></div>';
  var ta = $('.edta', el), pre = $('.edhl', el), stat = $('.rstat', el), runB = $('.rrun', el), stopB = $('.rstop', el);
  var out = $('.rout', el), otext = $('.rtext', el), oerr = $('.rerr', el), inrow = $('.inrow', el), inbox = $('.inbox', el);
  var inputs = [], running = false;
  ta.value = saved != null ? saved : starter;
  function paint(){ pre.innerHTML = hl(ta.value) + '\n'; }
  function save(){ store.set(key, ta.value); }
  paint();
  function showState(){
    if (running) return;
    stat.textContent = PY.state === 'ready' ? PY.msg : PY.state === 'loading' ? PY.msg : PY.state === 'fail' ? PY.msg : (PY.msg || 'Python starts when you press Run');
    stat.className = 'rstat' + (PY.state === 'fail' ? ' bad' : PY.state === 'ready' ? ' ok' : '');
  }
  PY.listeners.push(showState); showState();
  ta.addEventListener('input', function(){ paint(); save(); });
  ta.addEventListener('scroll', function(){ pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; });
  ta.addEventListener('keydown', function(e){
    var s = ta.selectionStart, en = ta.selectionEnd, v = ta.value;
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); start(); return; }
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); ta.setRangeText('    ', s, en, 'end'); paint(); save(); return; }
    if (e.key === 'Tab' && e.shiftKey) {
      e.preventDefault();
      var ls = v.lastIndexOf('\n', s - 1) + 1;
      var n = 0; while (n < 4 && v.charAt(ls + n) === ' ') n++;

      return;
    }
    if (e.key === 'Enter' && !e.shiftKey) {
      var lineStart = v.lastIndexOf('\n', s - 1) + 1;
      var line = v.slice(lineStart, s);
      var ind = (line.match(/^ */) || [''])[0];
      if (/:\s*(#.*)?$/.test(line)) ind += '    ';
      e.preventDefault(); ta.setRangeText('\n' + ind, s, en, 'end'); paint(); save();
    }
  });
  function setRunning(on){
    running = on; runB.disabled = on; stopB.hidden = !on;
    if (on) { stat.textContent = PY.state === 'ready' ? 'Running...' : PY.msg; stat.className = 'rstat'; }
    else showState();
  }
  function exec(){
    setRunning(true);
    out.hidden = false;
    var code = ta.value;
    pyRun(code, inputs.slice(), function(t){ stat.textContent = t; }).then(function(r){
      setRunning(false);
      if (r.status === 'stopped') { otext.textContent = (otext.textContent || '') ; oerr.hidden = false; oerr.textContent = 'Stopped. If your loop never ends, check that something changes each round so the condition can become False.'; inrow.hidden = true; return; }
      otext.textContent = r.out || (r.status === 'ok' ? '(no output: add print() to see results)' : '');
      otext.classList.toggle('dim', !r.out);
      if (r.status === 'error') { oerr.hidden = false; oerr.textContent = r.err; } else { oerr.hidden = true; }
      if (r.status === 'input') { inrow.hidden = false; inbox.value = ''; inbox.focus({ preventScroll: true }); }
      else inrow.hidden = true;
    }, function(){
      setRunning(false);
      oerr.hidden = false; oerr.textContent = 'Python could not start. Check your internet connection, then refresh the page.';
    });
  }
  function start(){ if (running) return; inputs = []; otext.textContent = ''; oerr.hidden = true; inrow.hidden = true; exec(); }
  runB.onclick = start;
  stopB.onclick = function(){ pyStop(); };
  $('.rreset', el).onclick = function(){ ta.value = starter; paint(); save(); out.hidden = true; inputs = []; };
  inrow.addEventListener('submit', function(e){ e.preventDefault(); inputs.push(inbox.value); inrow.hidden = true; exec(); });
}

  $('#q').addEventListener('input', function(){
    var q = this.value.toLowerCase().trim();
    $$('.chlink', side).forEach(function(b){ b.hidden = q && b.getAttribute('data-q').indexOf(q) < 0; });
    $$('.part', side).forEach(function(p){ p.hidden = !$$('.chlink', p).some(function(b){ return !b.hidden; }); });
  });
  $('#menuBtn').onclick = function(){ side.classList.add('open'); $('#scrim').classList.add('open'); };
  $('#scrim').onclick = closeDrawer;
}
function closeDrawer(){ side.classList.remove('open'); $('#scrim').classList.remove('open'); }
function updateSide(cur){
  var done = store.get('done', {});
  if (cur !== undefined) updateSide.cur = cur;
  $$('.chlink', side).forEach(function(b){
    var id = b.getAttribute('data-go');
    b.classList.toggle('done', !!done[id]);
    b.classList.toggle('on', id === updateSide.cur);
    $('.dot', b).textContent = done[id] ? '✓' : byId[id].num;
  });
  $$('#navtools button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-go') === updateSide.cur); });
  var dn = CH.filter(function(c){ return done[c.id]; }).length;
  $('#pbar').style.width = Math.round(dn / CH.length * 100) + '%';
  $('#ptxt').textContent = dn + ' of ' + CH.length + ' chapters done';
}

/* ---------- Views ---------- */
function vHome(){
  var done = store.get('done', {}), known = store.get('known', {});
  var allCards = []; CH.forEach(function(c){ allCards = allCards.concat(chCards(c)); });
  var kc = allCards.filter(function(c){ return known[c.id]; }).length;
  var dn = CH.filter(function(c){ return done[c.id]; }).length;
  var mins = CH.reduce(function(a, c){ return a + (parseInt(c.time, 10) || 0); }, 0);
  var exam = store.get('qz:exam', null);
  var last = store.get('last', null), lastC = last && byId[last];
  var next = CH.filter(function(c){ return !done[c.id]; })[0];
  var go = lastC && !done[lastC.id] ? lastC : (next || CH[0]);
  var nAnim = 0, nDeck = 0, nMM = 0, nQ = 0;
  CH.forEach(function(c){ (c.body || []).forEach(function(b){ if (b.t === 'anim') nAnim++; if (b.t === 'deck') nDeck++; if (b.t === 'mm') nMM++; }); nQ += (c.quiz || []).length; });
  var h = '<section class="hero"><div><div class="eyebrow">Data Analytics · Python module</div><h1>Learn Python from your first <mark>print()</mark> to NumPy</h1>' +
    '<p>' + CH.length + ' chapters in plain, simple English. Every chapter has notes, pictures, animated explainers, slides, practice tasks, a quiz and flashcards. Your progress saves in this browser.</p>' +
    '<div class="row"><button class="btn pri" type="button" data-go="' + go.id + '">' + (dn ? 'Continue: ' : 'Start: ') + esc(go.nav || go.title) + '</button><button class="btn" type="button" data-go="flashcards">Flashcards</button></div></div>' +
    '<div class="hero-term" aria-hidden="true"><div class="tb"><i></i><i></i><i></i></div><pre>' + hl('>>> name = "Python"\n>>> print(f"Hello, {name}!")') + '\nHello, Python!\n' + hl('>>> import numpy as np\n>>> np.array([1, 2, 3]) * 10') + '\narray([10, 20, 30])</pre></div></section>';
  h += '<div class="stats"><div class="stat"><b>' + dn + '/' + CH.length + '</b><span>chapters done</span></div><div class="stat"><b>' + kc + '/' + allCards.length + '</b><span>flashcards known</span></div><div class="stat"><b>' + (exam == null ? '–' : exam + '/25') + '</b><span>best exam score</span></div><div class="stat"><b>' + Math.round(mins / 60) + ' hrs</b><span>total study time</span></div></div>';
  h += '<div class="mount" data-m="0"></div>';
  h += '<section class="sec"><h2>All chapters</h2><p class="prose muted">Go in order. Chapters marked <span class="pill trap">tricky</span> have concepts that confuse most beginners, so they get extra explainers and practice.</p><div class="pgrid">' + PARTS.map(function(p){
    var chs = CH.filter(function(c){ return c.part === p.n; });
    return '<div class="pcard"><div class="pn">Part ' + p.n + '</div><h3>' + esc(p.title) + '</h3><p class="muted" style="font-size:14px">' + esc(p.sub || '') + '</p><ul>' + chs.map(function(c){ return '<li><button type="button" data-go="' + c.id + '"><span class="st' + (done[c.id] ? ' d' : '') + '"></span>' + c.num + '. ' + esc(c.nav || c.title) + (c.tricky ? ' <span class="pill trap" style="padding:0 6px;font-size:11px">tricky</span>' : '') + '</button></li>'; }).join('') + '</ul></div>';
  }).join('') + '</div></section>';
  h += '<section class="sec"><h2>Study tools</h2><div class="tools3"><button class="tool" type="button" data-go="flashcards"><b>Flashcards</b><span>' + allCards.length + ' cards from every chapter. Mark the ones you know.</span></button><button class="tool" type="button" data-go="exam"><b>Final exam</b><span>25 random questions from a bank of ' + nQ + '.</span></button><button class="tool" type="button" data-go="cheatsheet"><b>Cheat sheet</b><span>Every key command on one searchable page.</span></button></div></section>';
  h += '<section class="sec"><h2>How to study with this hub</h2><div class="how">' +
    '<div><b>1. Read the notes</b>Short sections with pictures. Yellow highlights are words to remember.</div>' +
    '<div><b>2. Play the explainers</b>' + nAnim + ' animated explainers show code running line by line. Pause any time.</div>' +
    '<div><b>3. Flip the slides</b>' + nDeck + ' slide decks sum up the big ideas in a few screens.</div>' +
    '<div><b>4. Predict, then check</b>Guess the output before you look. This is how the ideas stick.</div>' +
    '<div><b>5. Do the tasks</b>Type the practice code in Jupyter or Colab yourself. Solutions are hidden until you need them.</div>' +
    '<div><b>6. Quiz and flashcards</b>Finish each chapter with the quiz, then revise with flashcards a day later.</div></div></section>';
  view.className = 'col wide';
  view.innerHTML = h;
  var parts = PARTS.map(function(p){ return { t: 'Part ' + p.n + ': ' + p.title, k: CH.filter(function(c){ return c.part === p.n; }).map(function(c){ return { t: c.num + '. ' + (c.nav || c.title), go: c.id }; }) }; });
  mountAll(view, [{ t: 'mm', title: 'Course mind map', root: 'Python', hint: 'Tap any chapter to open it', kids: parts }]);
}

function vChapter(c){
  var mounts = [], toc = [];
  var h = '<header class="chead"><div class="num">Part ' + c.part + ' · Chapter ' + c.num + '</div><h1>' + esc(c.title) + '</h1><p class="lead">' + md(c.lead) + '</p>' +
    '<div class="row"><span class="pill lvl">' + esc(c.lvl || 'Beginner') + '</span><span class="pill">' + esc(c.time || '') + '</span>' + (c.tricky ? '<span class="pill trap">Tricky topic: extra practice inside</span>' : '') + '</div></header>';
  if (c.goals) h += '<div class="goals"><h3>In this chapter you will learn</h3><ul>' + c.goals.map(function(g){ return '<li>' + md(g) + '</li>'; }).join('') + '</ul></div>';
  h += '<div class="toc" id="toc"></div>';
  var body = '', open = false, ctx = { mounts: mounts, cid: c.id };
  (c.body || []).forEach(function(b, i){
    if (b.t === 'h') {
      if (open) body += '</section>';
      toc.push(b.text);
      body += '<section class="sec"><h2 id="' + c.id + '-s' + toc.length + '">' + md(b.text) + '</h2>';
      open = true; return;
    }
    if (!open) { body += '<section class="sec">'; open = true; }
    body += block(b, i, ctx) || '';
  });
  if (open) body += '</section>';
  h += body;
  var PST = window.POSTERS || {};
  if (PST[c.id]) h += '<section class="sec"><h2 id="' + c.id + '-poster">Revision poster</h2><p class="prose muted">The whole chapter on one page. Use it to revise before the quiz, or come back to it a week later.</p>' + posterHTML(PST[c.id], c.num) + '<div class="row"><button class="btn" type="button" data-poster="' + c.id + '">Open in the poster gallery (wide view)</button></div></section>';
  if (c.take) h += '<div class="take"><h3>Key takeaways</h3><ul>' + c.take.map(function(t){ return '<li>' + md(t) + '</li>'; }).join('') + '</ul></div>';
  if (c.quiz && c.quiz.length) h += '<section class="sec"><h2 id="' + c.id + '-quiz">Chapter quiz</h2><div id="quizBox"></div></section>';
  if (c.cards && c.cards.length) h += '<section class="sec"><h2 id="' + c.id + '-cards">Flashcards</h2><p class="prose muted">Say the answer out loud before you flip. Mark the cards you know and they drop out of "Only unknown".</p><div id="deckBox"></div></section>';
  var done = store.get('done', {});
  h += '<div class="donebox"><div><b style="font-family:var(--display)">Finished this chapter?</b><div class="muted" style="font-size:15px">Mark it done to track your progress.</div></div><button class="btn ' + (done[c.id] ? 'good' : 'pri') + '" id="doneBtn" type="button">' + (done[c.id] ? 'Done ✓' : 'Mark as done') + '</button></div>';
  var prev = CH[c.idx - 1], next = CH[c.idx + 1];
  h += '<nav class="endnav">' + (prev ? '<button class="btn" type="button" data-go="' + prev.id + '">← ' + esc(prev.nav || prev.title) + '</button>' : '<span></span>') + (next ? '<button class="btn pri" type="button" data-go="' + next.id + '">' + esc(next.nav || next.title) + ' →</button>' : '<button class="btn pri" type="button" data-go="exam">Take the final exam →</button>') + '</nav>';
  if (c.src) h += '<p class="srcs">Built from: ' + c.src.map(esc).join(' · ') + '</p>';
  view.className = 'col';
  view.innerHTML = h;
  var tocEl = $('#toc');
  var chips = toc.map(function(t, j){ return '<button type="button" data-s="' + c.id + '-s' + (j + 1) + '">' + md(t) + '</button>'; });
  if ((window.POSTERS || {})[c.id]) chips.push('<button type="button" data-s="' + c.id + '-poster">Poster</button>');
  if (c.quiz && c.quiz.length) chips.push('<button type="button" data-s="' + c.id + '-quiz">Quiz</button>');
  if (c.cards && c.cards.length) chips.push('<button type="button" data-s="' + c.id + '-cards">Flashcards</button>');
  tocEl.innerHTML = chips.join('');
  $$('button', tocEl).forEach(function(b){ b.onclick = function(){ var t = document.getElementById(b.getAttribute('data-s')); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }; });
  mountAll(view, mounts);
  if (c.quiz && c.quiz.length) Quiz($('#quizBox'), c.quiz, c.id);
  if (c.cards && c.cards.length) Deck($('#deckBox'), chCards(c));
  $('#doneBtn').onclick = function(){
    var d = store.get('done', {});
    if (d[c.id]) delete d[c.id]; else d[c.id] = 1;
    store.set('done', d);
    this.className = 'btn ' + (d[c.id] ? 'good' : 'pri');
    this.textContent = d[c.id] ? 'Done ✓' : 'Mark as done';
    if (d[c.id]) toast('Chapter ' + c.num + ' marked as done');
    updateSide();
  };
  store.set('last', c.id);
}

function vFlash(){
  var sel = store.get('fcSel', 'all');
  var h = '<header class="chead"><div class="num">Study tool</div><h1>Flashcards</h1><p class="lead">Every flashcard from every chapter. Pick a part, flip, and mark what you know.</p></header>' +
    '<div class="row" id="fcf"><button class="btn" type="button" data-p="all">All parts</button>' + PARTS.map(function(p){ return '<button class="btn" type="button" data-p="' + p.n + '">Part ' + p.n + '</button>'; }).join('') + '</div><div id="fcBox"></div>';
  view.className = 'col'; view.innerHTML = h;
  function load(){
    $$('#fcf button').forEach(function(b){ b.classList.toggle('pri', b.getAttribute('data-p') === String(sel)); });
    var cards = [];
    CH.forEach(function(c){ if (sel === 'all' || String(c.part) === String(sel)) cards = cards.concat(chCards(c)); });
    Deck($('#fcBox'), cards);
  }
  $$('#fcf button').forEach(function(b){ b.onclick = function(){ sel = b.getAttribute('data-p'); store.set('fcSel', sel); load(); }; });
  load();
}

function vExam(){
  var h = '<header class="chead"><div class="num">Study tool</div><h1>Final exam</h1><p class="lead">25 random questions from every chapter. Each new exam picks a fresh set. At the end you see your score for each chapter, so you know what to revise.</p></header><div id="exBox"></div>';
  view.className = 'col'; view.innerHTML = h;
  function start(){
    var all = []; CH.forEach(function(c){ all = all.concat(chQuiz(c)); });
    for (var k = all.length - 1; k > 0; k--) { var r = Math.floor(Math.random() * (k + 1)); var t = all[k]; all[k] = all[r]; all[r] = t; }
    var pick = all.slice(0, 25);
    pick.sort(function(a, b){ return byTitle[a.from] - byTitle[b.from]; });
    Quiz($('#exBox'), pick, 'exam', { exam: true, onAgain: start });
  }
  start();
}
var byTitle = {}; CH.forEach(function(c){ byTitle[c.title] = c.idx; });

function vCheat(){
  var h = '<header class="chead"><div class="num">Study tool</div><h1>Cheat sheet</h1><p class="lead">The key commands from every chapter in one place. Search for a word like <code>split</code>, <code>axis</code> or <code>dict</code>.</p></header>' +
    '<label for="cq" class="eyebrow">Search the cheat sheet</label><input id="cq" class="search" type="search" placeholder="Search commands or meanings" autocomplete="off"><div class="cheat" id="cBox"></div>';
  view.className = 'col'; view.innerHTML = h;
  function draw(q){
    q = (q || '').toLowerCase();
    var out = '';
    CH.forEach(function(c){
      var rows = (c.cheat || []).filter(function(r){ return !q || (r[0] + ' ' + r[1]).toLowerCase().indexOf(q) > -1; });
      if (!rows.length) return;
      out += '<div><h3>' + c.num + '. ' + esc(c.title) + '</h3><div class="tbl" style="margin-top:8px"><table><thead><tr><th style="width:44%">Code</th><th>What it does</th></tr></thead><tbody>' +
        rows.map(function(r){ return '<tr><td><code style="white-space:pre-wrap">' + esc(r[0]) + '</code></td><td>' + md(r[1]) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
    });
    $('#cBox').innerHTML = out || '<p class="muted">Nothing matches that search.</p>';
  }
  $('#cq').addEventListener('input', function(){ draw(this.value); });
  draw('');
}

function vPosters(){
  var PST = window.POSTERS || {};
  var list = CH.filter(function(c){ return PST[c.id]; });
  var sel = store.get('posterSel', list.length ? list[0].id : null);
  if (!PST[sel] && list.length) sel = list[0].id;
  var h = '<header class="chead"><div class="num">Study tool</div><h1>Revision posters</h1><p class="lead">One infographic per chapter. Each one puts the whole chapter on a single page: pictures, rules, traps and a comparison table.</p></header>' +
    '<label for="psel" class="eyebrow">Choose a chapter</label><select id="psel" class="search">' + list.map(function(c){ return '<option value="' + c.id + '"' + (c.id === sel ? ' selected' : '') + '>' + c.num + '. ' + esc(c.title) + '</option>'; }).join('') + '</select>' +
    '<div class="row"><button class="btn" type="button" id="pprev">\u2190 Previous</button><button class="btn" type="button" id="pnext">Next \u2192</button><button class="btn" type="button" id="pgo">Open this chapter</button></div><div id="pbox"></div>';
  view.className = 'col wide'; view.innerHTML = h;
  function draw(){
    var c = byId[sel];
    $('#pbox').innerHTML = posterHTML(PST[sel], c.num);
    $('#psel').value = sel; store.set('posterSel', sel);
  }
  function step(d){ var ids = list.map(function(c){ return c.id; }); var k = ids.indexOf(sel); sel = ids[(k + d + ids.length) % ids.length]; draw(); }
  $('#psel').onchange = function(){ sel = this.value; draw(); };
  $('#pprev').onclick = function(){ step(-1); };
  $('#pnext').onclick = function(){ step(1); };
  $('#pgo').onclick = function(){ route(sel); };
  draw();
}

/* ---------- Router ---------- */
var TOOLS = { home: vHome, flashcards: vFlash, exam: vExam, cheatsheet: vCheat, posters: vPosters };
function render(id){
  stopAll(); COPY = []; cellNo = 0;
  if (!TOOLS[id] && !byId[id]) id = 'home';
  if (TOOLS[id]) TOOLS[id](); else vChapter(byId[id]);
  updateSide(id);
  var c = byId[id];
  $('#topTitle').textContent = c ? c.num + '. ' + (c.nav || c.title) : ({ home: 'Python Study Hub', flashcards: 'Flashcards', exam: 'Final exam', cheatsheet: 'Cheat sheet', posters: 'Revision posters' })[id];
  closeDrawer();
  window.scrollTo(0, 0);
}
function route(id){
  if (('#' + id) === location.hash) render(id);
  else { try { location.hash = id; } catch(e){ render(id); } }
}
window.addEventListener('hashchange', function(){ render(location.hash.slice(1) || 'home'); });
view.addEventListener('click', function(e){
  var p = e.target.closest('[data-poster]');
  if (p) { store.set('posterSel', p.getAttribute('data-poster')); route('posters'); return; }
  var b = e.target.closest('[data-go]'); if (b && !b.closest('.mm')) route(b.getAttribute('data-go'));
});

buildSide();
render(location.hash.slice(1) || 'home');
})();

</script>

</body>
</html>
